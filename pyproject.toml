[build-system]
requires = ["setuptools>=77.0.3"]
build-backend = "setuptools.build_meta"

[project]
name = "django-fiber"
description = "A simple, user-friendly CMS for Django projects."
readme = { file = "README.rst", content-type = "text/x-rst" }
requires-python = ">=3.10"
license = "Apache-2.0"
license-files = ["LICENSE.rst"]
dynamic = ["version"]
authors = [
    { name = "Dennis Bunskoek", email = "dbunskoek@leukeleu.nl" },
]
keywords = ["cms", "django"]
dependencies = [
    "Django>=4.2.30,<4.3",
    "django-mptt>=0.18",
    "django-compressor>=4.6",
    "djangorestframework>=3.17.1",
    "easy-thumbnails>=2.10.1",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Internet :: WWW/HTTP :: Dynamic Content",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/django-fiber/django-fiber"
Documentation = "https://django-fiber.readthedocs.io/"
Repository = "https://github.com/django-fiber/django-fiber"
Issues = "https://github.com/django-fiber/django-fiber/issues"
Changelog = "https://github.com/django-fiber/django-fiber/blob/master/CHANGELOG.rst"

[tool.setuptools]
include-package-data = true
zip-safe = false

[tool.setuptools.packages.find]
include = ["fiber*"]

[tool.setuptools.dynamic]
version = { attr = "fiber.__version__" }
